<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <!--
      The title and description below are the LANDING PAGE's, not the app's.

      A signed-out visitor and a crawler both get this HTML, and neither runs
      far enough into the app to see anything a component sets later. So the
      static head has to sell the product: it leads with what HelixBid does,
      because the name does not explain itself and a result that reads only
      "HelixBid" gives a searcher nothing to click.

      The app retitles the tab for signed-in users (HelixBidShell), and
      LandingPageContainer re-applies these for a user navigating back out.
      client/src/content/trades/electrical.ts holds the same strings; keep them
      in step, or better, prerender this head from the trade config if this page
      ever becomes static.
    -->
    <title>
      BidRender — Electrical Estimating Software Built By An Electrician
    </title>
    <meta
      name="description"
      content="Take off plans, price materials and labor from your own rates, and send a professional proposal the same day. Estimating software built by an electrician, for electricians."
    />
    <!--
      No <link rel="canonical"> here. A canonical needs an absolute URL to mean
      anything, the deployed hostname is not known at build time, and a relative
      `href="/"` makes Vite try to resolve the site root as an asset and fail the
      build outright. LandingPageContainer sets og:url from location.origin at
      runtime, which is the same information for the scrapers that read it.
    -->
    <meta name="theme-color" content="#0F1117" />

    <!--
      Link previews. og:image is a relative path because the deployed hostname
      is not known at build time and a hardcoded wrong one is worse than a
      relative one — most scrapers resolve it against the page URL, and
      LandingPageContainer upgrades it to an absolute URL at runtime for the
      ones that execute JS.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BidRender" />
    <meta
      property="og:title"
      content="Electrical Estimating Built By An Electrician, For Electricians"
    />
    <meta
      property="og:description"
      content="Count devices off the plans, price them against your own rates, and send a professional proposal the same day."
    />
    <meta property="og:image" content="/brand/shot-bid.jpg" />
    <meta property="og:image:width" content="1523" />
    <meta property="og:image:height" content="784" />
    <meta
      property="og:image:alt"
      content="A BidRender bid priced out: line items with quantities and hours beside a total breaking down materials, labor, overhead and markup"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Electrical Estimating Built By An Electrician, For Electricians"
    />
    <meta
      name="twitter:description"
      content="Count devices off the plans, price them against your own rates, and send a professional proposal the same day."
    />
    <meta name="twitter:image" content="/brand/shot-bid.jpg" />

    <!--
      The "HB" placeholder mark. Served from /favicon.svg rather than the old
      /brand/ path deliberately: browsers cache a favicon hard per origin, and a
      new URL is what actually dislodges the one cached before the brand revert.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      ── Installing to a home screen ────────────────────────────────────────

      The manifest is what Android and desktop Chrome read: name, icons,
      colours, and the standalone display mode that drops the browser chrome.

      iOS reads almost none of it. Safari has supported `manifest` for years
      but still takes the home-screen icon from `apple-touch-icon` and the
      standalone behaviour from its own `apple-mobile-web-app-*` meta tags, so
      the four lines below are not belt-and-braces — without them "Add to Home
      Screen" on an iPhone produces a bookmark with a screenshot for an icon
      that opens in Safari with the address bar showing.

      `apple-touch-icon` is a PNG at 180×180 because that is what iOS asks for
      on a modern iPhone and it declines SVG entirely. It also gets no rounded
      corners of its own — iOS applies its squircle regardless, and drawing
      corners in as well leaves a dark halo.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      `black-translucent` puts the app's own dark ground behind the status bar
      rather than a white strip above it. It only reads correctly because the
      app is dark everywhere; on a light theme this would be the wrong choice.
    -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="BidRender" />
    <meta name="application-name" content="BidRender" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
    ></script>
  </body>
</html>
