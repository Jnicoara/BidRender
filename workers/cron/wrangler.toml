# The scheduler for BidRender's two nightly jobs. See worker.js.
#
# The two cron expressions below must match BACKUP_CRON and PURGE_CRON in
# server/scheduled/*.ts. TOML cannot import from TypeScript, so they are
# restated here — and server/scheduledBackup.test.ts asserts the two agree,
# because a schedule that silently drifts is a job that runs at the wrong time
# and never says so.
#
# FIVE fields, UTC. Standard cron, no seconds field: a six-field expression
# left over from the Manus scheduler would be rejected at deploy time, which is
# the good case, or silently misread, which is not.

name = "bidrender-cron"
main = "worker.js"
compatibility_date = "2026-09-16"

# On, matching what is deployed. The Worker is published at
# bidrender-cron.bidrender.workers.dev.
#
# ── What the first deploys were really complaining about (2026-09-17) ─────────
# The account had never registered a workers.dev subdomain, and Cloudflare will
# not attach a cron schedule until one exists. That is the whole story, but it
# took four attempts to see, because the error arrives in two different disguises
# depending on this setting:
#
#   workers_dev = false  →  the upload succeeds, then the schedules call fails
#                           with error 10063. The Worker is left existing with
#                           NO schedule, which looks deployed and never runs.
#   workers_dev unset    →  it fails earlier and far more plainly, at publish
#                           time, saying the subdomain needs registering.
#
# So `workers_dev = false` was NOT the cause, despite being the one thing that
# changed before the failures started — it only moved the same complaint to a
# later and more confusing stage. It was tried on the theory that a Worker with
# no target cannot hold a schedule; that theory was wrong.
#
# ── Registering the subdomain needs a real terminal ──────────────────────────
# `wrangler deploy` offers to register it interactively. A non-interactive shell
# — CI, or an agent session — answers "no" to that prompt on its own and fails,
# no matter how many times it is retried. It has to be done from a terminal a
# human can type into, or from the dashboard, where the suggested name sits in a
# form that must actually be submitted; reload the page to confirm it saved,
# because an unsubmitted suggestion reads exactly like a registered subdomain.
#
# ── The public address is inert, but it is not nothing ───────────────────────
# worker.js exports `scheduled` and no fetch handler, so a request to that
# address finds no code to run and errors. It cannot trigger a backup, reach the
# app, or expose CRON_SECRET. Setting this back to false would be tidier and
# should now work, since the blocker was the missing subdomain rather than this
# flag — but do not change it without checking Cron Triggers afterwards. The
# deploy half-succeeds on failure, so the Worker keeps looking healthy while
# silently never running again.
workers_dev = true

# 09:00 and 10:30 UTC — 2:00am and 3:30am Pacific in summer, an hour earlier
# in winter, because UTC does not observe daylight saving and Pacific does.
# Both are chosen to fall in the middle of the night for the app's users, and
# the 90-minute gap keeps the purge behind the backup.
[triggers]
crons = ["0 9 * * *", "30 10 * * *"]

[vars]
# The deployed app. No trailing slash needed — worker.js strips one.
#
# Must be the PRIMARY domain, never a redirecting or parked one. A redirect
# breaks the knock: the Worker POSTs, the redirect turns it into a GET, and the
# handler — mounted for POST — never answers. The job then fails every night,
# marked red on a Cloudflare page nobody watches, and the app's own warning does
# not appear for two days. A parked domain fails the same way and faster.
#
# bidrender.com is the name to keep away from here. It was the primary until
# 2026-09-17, then redirected, and has since been removed from App Platform
# altogether. Anything still pointing a check or a job at it is pointing at
# nothing.
APP_BASE_URL = "https://bidridge.com"

# CRON_SECRET is NOT here on purpose. It is a secret, so it is set with
#   npx wrangler secret put CRON_SECRET
# which stores it with Cloudflare instead of in a file that gets committed.
