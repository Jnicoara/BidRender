# The test gate, the staging auto-deploy and the browser smoke test —
# references/build-pipeline-plan.md, pieces 1, 2 and 3.
#
# 1. Every push to local-dev, a track-* or an a-* branch, and every pull
#    request, runs `pnpm check` and the full vitest suite against a brand-new
#    MySQL migrated from drizzle/ and seeded the way the server seeds itself
#    — or less, ONLY where less cannot change the answer: a docs-only push
#    runs the doc-reading tests, and a commit that already passed the full
#    suite is not re-tested (the "test" job's FULL / DOCS / SEEN, below).
# 2. A green push to local-dev then pushes the same commit to `staging` —
#    CODE ONLY: anything under drizzle/ that differs from what staging runs is
#    refused, because migrations are applied by hand, with a backup, by
#    Track A (CLAUDE.md § Deploying a migration). Paused by setting the
#    repository variable STAGING_AUTODEPLOY to "off".
# 3. Once staging serves that commit, the Playwright smoke test runs against
#    it (e2e/), on its own staging account, with throwaway bids.
#
# NOTHING HERE CAN REACH LIVE. No job pushes `main`, no secret names a live
# credential, and the smoke test refuses bidridge.com by name
# (scripts/smokeTarget.ts). Releasing live is one deliberate step by Track A
# (references/deploying.md § 4).
name: Gate

on:
  push:
    # a-* and c-* are Track A's and Track C's own work branches, so their
    # changes get the same gate before they reach local-dev. c-* added
    # 2026-10-08: c-sch80-500 was pushed and nothing ran.
    branches: [local-dev, "track-*", "a-*", "c-*"]
    # A push that changes ONLY notes does not start this workflow at all
    # (owner, 2026-10-16). Before, it ran a "DOCS" mode here that went green
    # on its own — over a code run it had just CANCELLED (cancel-in-progress
    # below), so a branch could show green over code no full run had ever
    # finished (Track B found `quantitiesIgnoreDeletedPlans` red for a day
    # that way). Notes pushes now run .github/workflows/docs-gate.yml, which
    # is red unless the code commit under them passed THIS workflow's suite,
    # and which cannot cancel a run here: a different workflow, a different
    # concurrency group. Keep these two patterns equal to docs-gate.yml's
    # `paths` (scripts/ciCodeCommitPassed.test.ts checks).
    paths-ignore: ["**.md", "references/**"]
  pull_request:

# One run per branch at a time; a newer push cancels the older run —
# EXCEPT on local-dev, where it waits. A local-dev run ends in the staging
# deploy and the smoke test, about 20 minutes, and three tracks merge there:
# on 2026-10-05 two smoke runs in an hour were cancelled part-way by the next
# merge, so no commit ever got a finished smoke (and Approval A in
# live-release-plan.md needs one). Queued, each run finishes; GitHub keeps
# only the NEWEST pending run, so a burst of merges still costs one extra run,
# not one per merge. Only local-dev runs deploy staging, so a smoke always
# tests the commit its own run deployed.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/local-dev' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # MySQL is the one PREINSTALLED on GitHub's Ubuntu runner (8.0, stopped
    # by default, root / root), started below — no image is pulled at all.
    #
    # Until 2026-10-14 this was a service container, and both public sources
    # for the image refused us: Docker Hub's unauthenticated pull limit on
    # 2026-10-09 (Gate 37990985389), then AWS's public mirror that replaced
    # it, "toomanyrequests: Data limit exceeded", on every track's Gate the
    # night of 2026-10-14 (38683716637 track-a-night, 38684208140 track-b).
    # GitHub's runners share IPs, so either limit is spent by strangers, and
    # the job failed before a single test ran. The preinstalled server cannot
    # be rate-limited and needs no secret.
    #
    # ── What this job runs: FULL or SEEN (references/private-repo-plan.md)
    # Every job-minute is billed once the repo is private, rounded UP per
    # job. So the job first decides how much testing this push needs, and
    # nothing that can change a result is ever tested less:
    #
    #   FULL  — the default: typecheck, migrate, seed, the whole suite.
    #   SEEN  — this exact commit already passed the FULL suite in another
    #           Gate run (a track tip fast-forwarded onto local-dev). Same
    #           commit, same files, same result; the deploy and smoke still run.
    #
    # There was a DOCS mode until 2026-10-16; notes-only pushes now run
    # docs-gate.yml instead (see `paths-ignore` above for why).
    #
    # Anything it cannot classify — a pull request, a new branch, a force
    # push whose `before` is gone, a failed API call — is FULL.
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      # Loopback, and `test` as its own word: what checkTestDatabase
      # (scripts/databaseGuard.ts) requires before the suite will run at all.
      # root / root is the runner image's own throwaway default; not a secret.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/bidrender_test_ci
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the drizzle guard and the docs-only diff both need it.
          fetch-depth: 0

      - name: Decide FULL, DOCS or SEEN
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=full
          if [ "$mode" = full ]; then
            # A run of this workflow on this commit whose "Test suite" step
            # passed. Only that step counts: a DOCS or SEEN run is a success
            # without having run the suite.
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=success&per_page=50" \
                --jq ".workflow_runs[] | select(.name == \"$GITHUB_WORKFLOW\" and .id != $GITHUB_RUN_ID) | .id" 2>/dev/null || true); do
              passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '.jobs[] | select(.name == "test") | .steps[] | select(.name == "Test suite") | .conclusion' 2>/dev/null || true)
              if [ "$passed" = success ]; then mode=seen; echo "Full suite already passed on this commit: run $id"; break; fi
            done
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "::notice::Gate mode: $mode"

      # Migrations stay with Track A (plan § 2). A track branch whose OWN
      # commits touch drizzle/ goes red here, before it can be merged. Was its
      # own job until 2026-10-14; a job is billed a whole minute for its 8 s.
      #
      # "Own" is the point: `git log --no-merges origin/local-dev..HEAD` lists
      # the commits on this branch that local-dev does not have, leaving out
      # merge commits. A's migrations that arrived by merging local-dev in are
      # already on local-dev, so they never appear — a plain diff against
      # local-dev would flag them, or flag a branch for merely being behind.
      - name: Refuse migrations written on a track branch
        if: startsWith(github.head_ref || github.ref_name, 'track-')
        run: |
          git fetch --no-tags origin local-dev
          commits=$(git log --no-merges --format='%h %s' origin/local-dev..HEAD -- drizzle/)
          if [ -n "$commits" ]; then
            echo "::error::This track branch changes drizzle/. Migrations are Track A's: hand the column to A in todo.md instead."
            echo "Commits on this branch that touch drizzle/:"
            echo "$commits"
            git log --no-merges --name-only --format='--- %h' origin/local-dev..HEAD -- drizzle/
            exit 1
          fi
          echo "No commit of this branch touches drizzle/."

      - uses: pnpm/action-setup@v4
        if: steps.mode.outputs.mode != 'seen'

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.mode != 'seen'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.mode.outputs.mode != 'seen'
        run: pnpm install --frozen-lockfile

      # Cheapest check first, so a type error fails in a minute.
      - name: Typecheck (app and tests)
        if: steps.mode.outputs.mode == 'full'
        run: pnpm check

      - name: Start MySQL (preinstalled on the runner)
        if: steps.mode.outputs.mode == 'full'
        run: |
          sudo systemctl start mysql.service
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot -proot -e "SELECT VERSION()"

      # utf8mb4_unicode_ci is not optional: a database created with the server
      # default dies at migration 0055 (ER_CANT_AGGREGATE_2COLLATIONS).
      - name: Create the test database
        if: steps.mode.outputs.mode == 'full'
        run: >-
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e
          "CREATE DATABASE bidrender_test_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      # Every migration from zero — which also proves they still apply cleanly.
      - name: Migrate
        if: steps.mode.outputs.mode == 'full'
        run: npx tsx scripts/migrate.mts

      # The server seeds the shipped library on start and the tests never do;
      # without this, 11 tests that need the shipped run types fail.
      - name: Seed the shipped library
        if: steps.mode.outputs.mode == 'full'
        run: npx tsx scripts/seedBaseline.mts

      # This step's NAME is read by the SEEN check above. Rename both together.
      - name: Test suite
        if: steps.mode.outputs.mode == 'full'
        run: pnpm test

  # ── Piece 2: code-only auto-deploy to staging ────────────────────────────
  deploy-staging:
    needs: test
    # Notes-only pushes never reach this workflow (`paths-ignore`), so no
    # staging rebuild is spent on them; staging takes the commit with the
    # next code push.
    if: github.event_name == 'push' && github.ref_name == 'local-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      deployed: ${{ steps.push.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paused?
        if: vars.STAGING_AUTODEPLOY == 'off'
        run: echo "::warning::Auto-deploy to staging is PAUSED (repository variable STAGING_AUTODEPLOY=off). Nothing was pushed."

      # The comparison is against what staging RUNS (origin/staging), not the
      # previous commit: a migration merged three pushes ago still blocks
      # until Track A has applied it to staging and pushed staging by hand.
      - name: Refuse migrations, and anything that is not a fast-forward
        if: vars.STAGING_AUTODEPLOY != 'off'
        run: |
          git fetch --no-tags origin staging
          if ! git merge-base --is-ancestor origin/staging HEAD; then
            echo "::error::staging has commits local-dev does not. Somebody pushed staging by hand; Track A decides what happens next. Nothing was pushed."
            exit 1
          fi
          changed=$(git diff --name-only origin/staging HEAD -- drizzle/)
          if [ -n "$changed" ]; then
            echo "::error::Not deployed: this push changes drizzle/ against what staging runs. Migrations are applied by hand, with a backup, by Track A — then Track A pushes staging. Files:"
            echo "$changed"
            exit 1
          fi
          echo "Code only: no file under drizzle/ differs from staging."

      - name: Push this commit to staging
        id: push
        if: vars.STAGING_AUTODEPLOY != 'off'
        run: |
          git push origin "HEAD:refs/heads/staging"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # DigitalOcean builds `staging` on every push, in 3–6 minutes, and a
      # failed build leaves the OLD version running with nothing said. So
      # wait until staging serves this exact commit, or fail loudly.
      - name: Wait for staging to serve this commit
        if: steps.push.outputs.deployed == 'true'
        run: |
          short="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            served=$(curl -fsS https://staging.bidridge.com/api/version | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ -n "$served" ] && [ "${GITHUB_SHA#"$served"}" != "$GITHUB_SHA" ]; then
              echo "staging serves $served"
              exit 0
            fi
            sleep 15
          done
          echo "::error::staging did not start serving $short within 15 minutes. The build probably failed and DigitalOcean kept the previous version — check DigitalOcean → Activity."
          exit 1

  # ── Piece 3: the browser smoke test on staging ───────────────────────────
  smoke:
    needs: deploy-staging
    if: needs.deploy-staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One staging smoke account: never at the same time as a smoke-repeat run
    # (.github/workflows/smoke-repeat.yml). Queued, never cancelled.
    concurrency:
      group: staging-smoke
      cancel-in-progress: false
    env:
      SMOKE_BASE_URL: https://staging.bidridge.com
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      SMOKE_STAGING_PASSWORD: ${{ secrets.SMOKE_STAGING_PASSWORD }}
    steps:
      - name: Smoke account configured?
        id: configured
        run: |
          if [ -z "$SMOKE_EMAIL" ] || [ -z "$SMOKE_PASSWORD" ] || [ -z "$SMOKE_STAGING_PASSWORD" ]; then
            echo "::warning::Browser smoke test NOT RUN: the SMOKE_EMAIL / SMOKE_PASSWORD / SMOKE_STAGING_PASSWORD repository secrets are not all set. See references/deploying.md § 12."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.configured.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.configured.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        if: steps.configured.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Smoke test staging
        if: steps.configured.outputs.ready == 'true'
        run: pnpm smoke

      # A failed test keeps a Playwright TRACE (e2e/playwright.config.ts),
      # and a trace carries the passwords and the session cookie. The repo is
      # public, so an artifact is readable by anyone: each trace.zip is sealed
      # here, with the smoke secrets as the passphrase — whoever can open it
      # already holds everything inside it — and the plain file is deleted.
      # The upload below matches *.png and *.trace.enc only, so a trace this
      # step failed to seal is left behind, never uploaded. To open one:
      # references/deploying.md § 12.
      - name: Seal the failure traces
        if: failure() && steps.configured.outputs.ready == 'true'
        env:
          TRACE_KEY: ${{ secrets.SMOKE_STAGING_PASSWORD }}${{ secrets.SMOKE_PASSWORD }}
        run: |
          find e2e/.results -name trace.zip -print0 2>/dev/null |
            while IFS= read -r -d '' trace; do
              openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
                -pass env:TRACE_KEY -in "$trace" -out "${trace%.zip}.trace.enc"
              rm -f "$trace"
            done

      # Failure screenshots, and the SEALED traces only. The session file
      # (e2e/.auth/) is excluded here by name.
      - name: Keep the failure screenshots and sealed traces
        if: failure() && steps.configured.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures
          path: |
            e2e/.results/**/*.png
            e2e/.results/**/*.trace.enc
            !e2e/.auth/**
          retention-days: 7
          if-no-files-found: ignore
          # REQUIRED: the screenshots live under e2e/.results, a dot-folder,
          # and upload-artifact@v4 skips hidden paths by default — so until
          # 2026-10-06 this step never uploaded a single screenshot ("No files
          # were found"), and the one failure that needed a picture had none.
          # The patterns are .png and SEALED traces only (never a plain
          # trace.zip), and e2e/.auth stays excluded.
          include-hidden-files: true
